name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: heatingpump_security_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d heatingpump_security_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci_test_password@127.0.0.1:5432/heatingpump_security_test
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Run SEO tests
        run: npm run test:seo

      - name: Build server
        run: npm run build:server

      - name: Run server unit tests
        run: npm test --prefix server

      - name: Run API and PostgreSQL integration tests
        run: npm run test:integration --prefix server

      - name: Audit frontend production dependencies
        run: npm audit --omit=dev

      - name: Audit server production dependencies
        run: npm audit --prefix server --omit=dev

      - name: Validate Docker Compose configuration
        env:
          DB_NAME: heatingpump_ci_test
          DB_USER: heatingpump_ci
          DB_PASSWORD: ci_only_password
          SESSION_SECRET: ci_only_session_secret_0123456789abcdef0123456789abcdef
          POLICY_VERSION: 1.1
          APP_ORIGIN: http://localhost
          SITE_ADDRESS: localhost
          LEADS_ENABLED: "true"
        run: docker compose config --quiet
