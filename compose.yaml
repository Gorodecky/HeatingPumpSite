services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in deploy.env}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in deploy.env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deploy.env}
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=20", "-c", "work_mem=2MB"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 320m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks: [internal]

  api:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in deploy.env}
      POLICY_VERSION: ${POLICY_VERSION:?Set POLICY_VERSION in deploy.env}
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN in deploy.env}
      LEADS_ENABLED: ${LEADS_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m
    networks: [internal]

  migrate:
    build:
      context: ./server
      target: build
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m
    networks: [internal]
    profiles: [tools]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGUSER: ${DB_USER:?Set DB_USER in deploy.env}
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deploy.env}
      DB_USER: ${DB_USER:?Set DB_USER in deploy.env}
      DB_NAME: ${DB_NAME:?Set DB_NAME in deploy.env}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./deploy/backup-loop.sh:/usr/local/bin/backup-loop.sh:ro
      - postgres_backups:/backups
    entrypoint: ["sh", "/usr/local/bin/backup-loop.sh"]
    mem_limit: 96m
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_LEADS_ENABLED: ${LEADS_ENABLED:-false}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in deploy.env}
    depends_on: [api]
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
      - "${WEB_HTTPS_PORT:-443}:443"
      - "${WEB_HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 96m
    networks: [internal]

volumes:
  postgres_data:
  postgres_backups:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
